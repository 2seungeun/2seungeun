<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5QGRGS772R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5QGRGS772R');
</script>

<!-- MathJax is required because GitHub Pages does not load a math renderer by default. -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    "HTML-CSS": {
      availableFonts: ["TeX"]
    }
  });
</script>
<script
  type="text/javascript"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-MML-AM_CHTML">
</script>

{% if page.datePublished and page.author %}
<meta name="author" content="{{ page.author }}">
<meta property="article:published_time" content="{{ page.datePublished }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ page.author | jsonify }}
  },
  "datePublished": {{ page.datePublished | jsonify }},
  "inLanguage": {{ page.lang | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }}
}
</script>
{% endif %}
